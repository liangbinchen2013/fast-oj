{{define "content"}}
<div class="auth-shell">
  <section class="auth-card">
    <h1>登录</h1>

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{.Data.Next}}">
      <label for="login-identifier">邮箱或用户名</label>
      <input type="text" id="login-identifier" name="identifier" value="{{.Data.Identifier}}" autocomplete="username" required>
      <label for="login-password">密码</label>
      <input type="password" id="login-password" name="password" autocomplete="current-password" required>
      {{template "humanfield" .Data.Human}}
      <p><input type="submit" value="登录"></p>
    </form>

    <p class="auth-note">还没有账号？<a href="/register">注册</a>。</p>
  </section>
</div>

{{template "humanverify" .Data.Human}}
{{end}}
